<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Society AI Audit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #edf0f4;
      color: #1a1a2e;
      line-height: 1.65;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #0f0c29 0%, #1a1a4e 50%, #24243e 100%);
      color: #fff;
      padding: 56px 32px 48px;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    header p {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.5px;
    }
    .model-pills {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
    }
    .pill svg { width: 16px; height: 16px; }
    .pill-gpt  { background: rgba(16,163,127,0.2);  color: #5dffd9; }
    .pill-gem  { background: rgba(66,133,244,0.2);  color: #93b7ff; }
    .pill-cla  { background: rgba(217,119,87,0.2);  color: #ffb899; }

    /* ── Layout ── */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    /* ── Category header ── */
    .category { margin-bottom: 48px; }
    .category-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .category-badge {
      background: #1a1a2e;
      color: #fff;
      padding: 5px 18px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .category-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, #c0c8d8, transparent);
    }

    /* ── Question card ── */
    .question-block {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
      margin-bottom: 28px;
    }
    .question-header {
      background: #f4f6fa;
      border-bottom: 1px solid #e4e8f0;
      padding: 22px 28px;
    }
    .q-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #8893aa;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 5px;
    }
    .q-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.4;
    }

    /* ── Three-column responses ── */
    .responses-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .response-col {
      border-right: 1px solid #e8ecf2;
    }
    .response-col:last-child { border-right: none; }

    /* Model header strip */
    .model-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .model-strip svg { width: 26px; height: 26px; flex-shrink: 0; }
    .model-label {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .col-gpt .model-strip  { background: #f0faf7; border-bottom-color: #d0ede8; }
    .col-gpt .model-label  { color: #0a7c59; }
    .col-gem .model-strip  { background: #f0f4ff; border-bottom-color: #cfd9ff; }
    .col-gem .model-label  { color: #2e44b8; }
    .col-cla .model-strip  { background: #fff5f0; border-bottom-color: #fcd9c8; }
    .col-cla .model-label  { color: #b94518; }

    /* Response body */
    .response-body {
      padding: 18px 20px;
      font-size: 0.875rem;
      color: #374151;
      line-height: 1.72;
    }
    .response-body p { margin-bottom: 10px; }
    .response-body p:last-child { margin-bottom: 0; }
    .response-body strong { color: #111827; font-weight: 700; }
    .response-body em { font-style: italic; color: #4b5563; }
    .response-body ul {
      margin: 6px 0 10px 18px;
    }
    .response-body li { margin-bottom: 4px; }
    .response-body .section-label {
      font-weight: 700;
      color: #111;
      margin-top: 12px;
      display: block;
    }

    @media (max-width: 860px) {
      .responses-grid { grid-template-columns: 1fr; }
      .response-col { border-right: none; border-bottom: 1px solid #e8ecf2; }
      .response-col:last-child { border-bottom: none; }
    }
  </style>
</head>

<script>

  <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.77.77 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.896zm16.597 3.855l-5.843-3.372L15.117 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.405-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>

// ── Markdown → HTML converter ─────────────────────────────────────────────────

function md(text) {
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');

  const blocks = text.trim().split(/\n{2,}/);
  return blocks.map(block => {
    const lines = block.split('\n');
    if (lines.every(l => l.trim().startsWith('- '))) {
      const items = lines.map(l => `<li>${inline(l.trim().slice(2))}</li>`).join('');
      return `<ul>${items}</ul>`;
    }
    // Mixed block: some lines may be list items
    let html = '';
    let inList = false;
    for (const line of lines) {
      if (line.trim().startsWith('- ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inline(line.trim().slice(2))}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (line.trim()) html += `<p>${inline(line.trim())}</p>`;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }).join('');
}

// ── Data ──────────────────────────────────────────────────────────────────────

const categories = [
  {
    name: "Access &amp; Equity",
    questions: [
      {
        num: 1,
        q: "Who gets to participate — and who is structurally excluded from the networked economy?",
        chatgpt: `Participation in the networked economy is often influenced by factors such as access to digital infrastructure, financial resources, and digital literacy. Individuals in developed regions with robust internet connectivity and technological ecosystems are typically well-positioned to engage. However, those in rural areas, underdeveloped countries, or from marginalized communities may be structurally excluded due to inadequate access to technology, lack of education, and systemic socioeconomic barriers. Additionally, policies and systems that fail to address language and accessibility needs further marginalize certain groups, highlighting the need for inclusive strategies to bridge these digital divides.`,
        gemini: `Participation in the networked economy predominantly favors individuals with reliable internet access, modern devices, and sufficient digital literacy, often correlating with urban residency and higher socioeconomic status. However, significant structural exclusion persists due to pervasive digital divides, stemming from poverty, geographical remoteness leading to "digital deserts," and lack of affordable infrastructure. Systemic inequalities, including discriminatory practices and limited access to quality education, further marginalize communities, preventing them from acquiring essential skills or capital. This creates a stark chasm, locking out billions from the opportunities and benefits promised by a globalized, networked economy.`,
        claude: `Participation in the networked economy is largely shaped by intersecting barriers: **access to reliable infrastructure** (broadband, devices), **digital literacy**, **language**, and **capital** — both financial and social. Those without stable internet connections, formal education, or credit histories find themselves locked out of platforms that increasingly mediate employment, commerce, and civic life. Geographic divides matter enormously too — rural and Global South populations often face infrastructure gaps that aren't simply temporary but reflect deliberate investment decisions prioritizing profitable markets.

Crucially, even nominal "inclusion" can mask **extractive participation**, where gig workers, data subjects, or content creators generate value they don't meaningfully own or govern. The structural question isn't just who logs on, but who sets the terms — and that power remains concentrated among a remarkably small set of platform owners, investors, and regulators from wealthy nations.`
      },
      {
        num: 2,
        q: "Is access to the internet a fundamental human right or a commodity subject to market forces?",
        chatgpt: `Access to the internet is increasingly being viewed as a fundamental human right, particularly as digital connectivity becomes essential for exercising other rights, such as the right to education, freedom of expression, and access to information. The United Nations has highlighted internet access as integral to human development, enabling individuals to improve their quality of life and participate fully in society. However, the reality is that internet access is still often managed as a commodity, subject to market forces, pricing structures, and infrastructure limitations set by private corporations and states. The challenge lies in bridging the gap between idealistic aspirations and economic realities, ensuring equitable access while balancing the commercial interests of service providers. As more services and opportunities migrate online, the ethical imperative to provide universal access continues to grow.`,
        gemini: `While the provision of internet access involves significant infrastructure investment and market competition, making it a commodity in its delivery, its nature has profoundly shifted. In the 21st century, internet connectivity is increasingly indispensable for exercising fundamental human rights like education, freedom of expression, access to information, economic opportunity, and civic participation. To deny access is often to deny full participation in modern society. Therefore, while market forces play a role, ensuring universal, affordable access often necessitates public policy and regulatory frameworks, treating it as a foundational utility essential for human dignity and societal inclusion, moving beyond a purely market-driven view.`,
        claude: `This is genuinely contested territory where both frameworks capture something important. The internet has become so foundational to participation in economic life, civic discourse, healthcare access, and education that treating it purely as a commodity effectively creates a two-tiered citizenship where wealth determines meaningful social participation. The UN has recognized internet access as important to human rights expression, though notably stopping short of declaring connectivity itself a fundamental right.

However, the commodity framework isn't simply wrong — infrastructure requires investment, maintenance, and ongoing development that market mechanisms can incentivize effectively. The more honest position is that **the internet functions infrastructurally like utilities**, where baseline access arguably warrants rights-like protections while quality and speed can remain market-differentiated.

The critical tension is that framing access as a right without addressing what that actually guarantees — bandwidth minimums, device access, digital literacy — risks being symbolic rather than substantive. Countries like Finland and Estonia have moved toward legal guarantees, offering instructive real-world data on whether this produces better outcomes than pure market approaches.`
      }
    ]
  },
  {
    name: "Power &amp; Governance",
    questions: [
      {
        num: 3,
        q: "Who controls the platforms, algorithms, and data pipelines that now shape public life?",
        chatgpt: `The control over platforms, algorithms, and data pipelines is largely held by a small group of powerful technology companies often referred to as "Big Tech," such as Google, Facebook (now Meta), Amazon, and Apple. These companies are driven by their proprietary algorithms and data collection methods, which they use to influence user engagement and monetize through advertising and other services. While governments attempt regulatory oversight, the pace of technological advancement often outstrips legislative efforts, leaving significant power in the hands of these corporations. Furthermore, the centralized control by a few entities raises concerns about transparency, privacy, and the potential bottleneck of information and services that can lead to societal biases and inequities. To address these issues, there's growing advocacy for more decentralized control, enhanced regulation, privacy protection, and ethical accountability in tech development and deployment.`,
        gemini: `Control over platforms, algorithms, and data pipelines is primarily consolidated within a few powerful tech corporations that design, own, and operate these pervasive systems. Yet, this power is not absolute, as governments worldwide increasingly assert regulatory authority through antitrust measures and data privacy laws to shape their operations. Engineers and product designers also exert significant influence through their fundamental architectural and ethical choices, embedded in the very code. Furthermore, users, civil society, and investors collectively exert indirect pressures, influencing platform policies and public discourse. Thus, control is a highly distributed and dynamic interplay, continuously negotiated among powerful corporate entities, regulatory bodies, and various societal stakeholders.`,
        claude: `A concentrated set of actors holds this power: a handful of large technology corporations (primarily Meta, Google, Amazon, Microsoft, and Apple) control the dominant platforms and infrastructure, while a smaller circle of executives, engineers, and major shareholders make consequential design decisions with limited democratic accountability. Governments exercise partial influence through regulation, but enforcement is uneven — the EU has pushed hardest through instruments like the GDPR and Digital Markets Act, while US oversight remains fragmented.

Increasingly, institutional investors and advertisers also shape platform behavior indirectly, since revenue models determine what content gets amplified. What makes this genuinely complex is that control isn't monolithic — it's distributed across technical systems, business incentives, regulatory frameworks, and user behavior in ways that make clean accountability difficult to assign or reform.`
      },
      {
        num: 4,
        q: "How should democratic societies regulate AI and algorithmic decision-making without stifling innovation?",
        chatgpt: `Democratic societies should aim for a balanced regulatory approach to AI and algorithmic decision-making by establishing clear ethical guidelines that prioritize transparency, accountability, and fairness. Regulations should require companies to implement explainability in AI systems to ensure users and affected individuals understand how decisions are made, without necessarily demanding the disclosure of proprietary algorithms. It's important to set standards for data quality and bias mitigation to protect against discrimination while encouraging research and collaboration between government, academia, and industry to foster innovation. Additionally, implementing a risk-based framework where regulations are proportionate to the potential societal impact of the AI systems can prevent unnecessary bureaucratic burdens on less impactful innovations.`,
        gemini: `Democratic societies should adopt a risk-based, proportional approach, focusing regulation on high-impact AI systems rather than broad technological bans. This involves mandating transparency, accountability, and human oversight for critical algorithmic decisions, alongside robust impact assessments and explainability requirements. To avoid stifling innovation, regulation should be principles-based, allowing for diverse technological solutions and creating "innovation sandboxes" for ethical development. Fostering public-private collaboration, offering incentives for trustworthy AI, and investing in research will cultivate responsible innovation. The goal is to safeguard fundamental rights and democratic values while enabling beneficial technological progress.`,
        claude: `This is genuinely difficult terrain requiring honest tradeoffs rather than comfortable platitudes. **The core tension is real**: meaningful oversight requires understanding systems that move faster than regulatory capacity, while light-touch approaches historically allow harm to accumulate before correction arrives.

**What evidence suggests works reasonably well:**
- Risk-tiered regulation (higher scrutiny for consequential decisions like credit, hiring, criminal justice) rather than blanket rules
- Mandatory impact assessments and algorithmic auditing requirements, with independent third-party verification
- Transparency obligations calibrated to context — not exposing trade secrets, but enabling meaningful accountability

**Where I'd push back on common assumptions:**
- "Innovation stifling" concerns are often industry-lobbying framings; regulation frequently *drives* innovation toward safer designs
- Democratic legitimacy matters independently of efficiency — societies have genuine interests in how power is exercised over them
- Purely technical solutions like explainability requirements can create *theater* of accountability without substance

**Honest uncertainties:**
- We lack good evidence on which regulatory approaches actually improve outcomes versus creating compliance burdens
- International coordination problems are genuinely unsolved
- Democratic processes themselves can be captured by interests they're meant to regulate`
      },
      {
        num: 5,
        q: "In a borderless information environment, what authority do nation-states still hold — and over what?",

function renderModel(model, text, svgLogo, colClass, labelText) {
  return `
    <div class="response-col ${colClass}">
      <div class="model-strip">
        ${svgLogo}
        <span class="model-label">${labelText}</span>
      </div>
      <div class="response-body">${md(text)}</div>
    </div>`;
}

function renderQuestion(q) {
  return `
    <div class="question-block">
      <div class="question-header">
        <div class="q-label">Question ${q.num}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="responses-grid">
        ${renderModel('chatgpt', q.chatgpt, SVG_CHATGPT, 'col-gpt', 'ChatGPT (GPT-4o)')}
        ${renderModel('gemini', q.gemini, SVG_GEMINI, 'col-gem', 'Gemini (2.5-flash)')}
        ${renderModel('claude', q.claude, SVG_CLAUDE, 'col-cla', 'Claude (Sonnet 4.6)')}
      </div>
    </div>`;
}

function renderCategory(cat) {
  return `
    <div class="category">
      <div class="category-header">
        <span class="category-badge">${cat.name}</span>
        <div class="category-rule"></div>
      </div>
      ${cat.questions.map(renderQuestion).join('')}
    </div>`;
}
